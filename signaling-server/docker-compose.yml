# Signaling server behind Caddy (automatic HTTPS) plus coturn for TURN relay.
# 1. Point DNS for SIGNALING_DOMAIN and TURN_DOMAIN to this server.
# 2. Copy .env.example to .env and fill it in.
# 3. docker compose up -d
services:
  signaling:
    build: .
    restart: unless-stopped
    environment:
      DS_ADDR: ":8443"
      DS_TURN_URLS: "turn:${TURN_DOMAIN}:3478?transport=udp,turn:${TURN_DOMAIN}:3478?transport=tcp"
      DS_TURN_SECRET: "${TURN_SECRET}"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${SIGNALING_DOMAIN} --to signaling:8443
    volumes: ["caddy-data:/data"]
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_DOMAIN}
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --min-port=49160
      - --max-port=49200
volumes:
  caddy-data:
